<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Paperwren app icon</title>
  <desc id="description">
    A white folded-paper wren with an uplifted tail, set against a
    rounded black background.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="64" y1="32"
      x2="448" y2="492"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#2B2B2B"/>
      <stop offset="0.52" stop-color="#141414"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <radialGradient
      id="ambient"
      cx="0" cy="0" r="1"
      gradientTransform="translate(164 116) rotate(48) scale(420)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient
      id="paper"
      x1="214" y1="168"
      x2="309" y2="350"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEDED"/>
    </linearGradient>

    <linearGradient
      id="tailFold"
      x1="112" y1="172"
      x2="212" y2="291"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#EFEFEF"/>
      <stop offset="1" stop-color="#C4C4C4"/>
    </linearGradient>

    <linearGradient
      id="wing"
      x1="205" y1="249"
      x2="287" y2="333"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#F8F8F8"/>
      <stop offset="1" stop-color="#DCDCDC"/>
    </linearGradient>

    <linearGradient
      id="fold"
      x1="286" y1="214"
      x2="308" y2="257"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#D6D6D6"/>
      <stop offset="1" stop-color="#ADADAD"/>
    </linearGradient>

    <linearGradient
      id="rim"
      x1="76" y1="24"
      x2="432" y2="492"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <path
      id="wren"
      d="
        M 104 164
        L 220 226
        L 293 184
        C 306 176 318 173 331 174
        C 352 175 369 190 376 210
        L 408 225
        L 375 239
        C 372 263 359 284 340 300
        L 300 330
        C 279 346 251 349 229 337
        C 211 328 198 313 186 294
        L 144 278
        Z
      "
    />
  </defs>

  <g id="background-tile">
    <rect
      width="512"
      height="512"
      rx="112"
      fill="#000000"
    />

    <rect
      width="512"
      height="512"
      rx="112"
      fill="url(#background)"
    />

    <rect
      width="512"
      height="512"
      rx="112"
      fill="url(#ambient)"
    />

    <rect
      x="1"
      y="1"
      width="510"
      height="510"
      rx="111"
      stroke="url(#rim)"
      stroke-width="2"
    />
  </g>

  <!-- Bigger bird for better mobile app visibility -->
  <g transform="translate(256 256) scale(1.4) translate(-256 -256)">
    <g id="paper-shadow" aria-hidden="true">
      <use
        href="#wren"
        transform="translate(0 12)"
        fill="#000000"
        opacity="0.45"
      />
      <use
        href="#wren"
        transform="translate(0 5)"
        fill="#000000"
        opacity="0.5"
      />
    </g>

    <g id="paper-wren">
      <use href="#wren" fill="url(#paper)"/>

      <path
        d="M104 164 L220 226 L186 294 L144 278 Z"
        fill="url(#tailFold)"
      />

      <path
        d="M104 164 L220 226 L167 249 Z"
        fill="#F7F7F7"
      />

      <path
        d="M104 164 L167 249 L144 278 Z"
        fill="#D9D9D9"
      />

      <path
        d="M109 173 L167 249 L211 230"
        stroke="#FFFFFF"
        stroke-opacity="0.4"
        stroke-width="1.5"
        stroke-linejoin="round"
      />

      <path
        d="
          M186 294
          L304 272
          L300 330
          C279 346 251 349 229 337
          C211 328 198 313 186 294
          Z
        "
        fill="#E3E3E3"
      />

      <path
        d="M199 258 L287 213 L316 250 L265 339 Z"
        fill="#8C8C8C"
        opacity="0.12"
      />

      <path
        d="M194 252 L286 208 L310 247 L260 331 Z"
        fill="url(#wing)"
      />

      <path
        d="M286 208 L278 247 L310 247 Z"
        fill="url(#fold)"
      />

      <path
        d="M194 252 L286 208 L310 247"
        stroke="#FFFFFF"
        stroke-opacity="0.8"
        stroke-width="2"
        stroke-linejoin="round"
      />

      <path
        d="M278 247 L310 247"
        stroke="#9A9A9A"
        stroke-opacity="0.3"
        stroke-width="1.5"
      />

      <path
        d="M194 252 L260 331"
        stroke="#FFFFFF"
        stroke-opacity="0.6"
        stroke-width="1.5"
      />

      <path
        d="M376 225 L408 225 L375 239 Z"
        fill="#DADADA"
      />

      <circle
        cx="348"
        cy="211"
        r="5.5"
        fill="#0A0A0A"
      />
    </g>
  </g>
</svg>
