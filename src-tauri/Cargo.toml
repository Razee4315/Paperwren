[package]
name = "paperwren"
version = "1.7.0"
edition = "2021"
rust-version = "1.77.2"
description = "Paperwren: a feather-light document viewer"
authors = ["Paperwren"]

[lib]
name = "paperwren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paperwren"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Updates on Windows and macOS only: Android updates through its store,
# and its APK must carry no network permission.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# One window: a document opened while the app runs (a double-click in
# Explorer or a file manager) becomes a tab in it, not a second app.
tauri-plugin-single-instance = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
