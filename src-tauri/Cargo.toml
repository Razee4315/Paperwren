[package]
name = "paperwren"
version = "0.9.7"
edition = "2021"
rust-version = "1.77.2"
description = "Paperwren: a feather-light document viewer"
authors = ["Paperwren"]

[lib]
name = "paperwren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paperwren"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
