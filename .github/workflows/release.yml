name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-bump:
    name: Version check and bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (for lockfile generation when missing)
        uses: dtolnay/rust-toolchain@stable

      - name: Check for changes and bump version
        id: bump
        run: |
          set -eo pipefail
          CURRENT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT_VERSION"

          if git tag -l "v$CURRENT_VERSION" | grep -q "v$CURRENT_VERSION"; then
            COMMITS_SINCE=$(git rev-list "v$CURRENT_VERSION"..HEAD --count 2>/dev/null || echo "0")
            echo "Commits since v$CURRENT_VERSION: $COMMITS_SINCE"

            if [ "$COMMITS_SINCE" -eq "0" ]; then
              echo "No new commits since last release, skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "Bumping version: $CURRENT_VERSION to $NEW_VERSION"

            jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
            # Keep Cargo.lock in sync or every build rewrites it (own crate entry).
            if [ -f src-tauri/Cargo.lock ]; then
              sed -i "/name = \"paperwren\"/{n;s/version = \"[^\"]*\"/version = \"$NEW_VERSION\"/}" src-tauri/Cargo.lock
            else
              # First run: the lock has never been committed. Generate it
              # so it lands in this commit and stays pinned from now on.
              cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
              sed -i "/name = \"paperwren\"/{n;s/version = \"[^\"]*\"/version = \"$NEW_VERSION\"/}" src-tauri/Cargo.lock
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            git push

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$CURRENT_VERSION does not exist, first release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Windows installer
    needs: check-and-bump
    if: needs.check-and-bump.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Paperwren v__VERSION__
          releaseBody: |
            Paperwren v__VERSION__. Open anything. Instantly.

            Downloads for Windows are attached below. See the README for what Paperwren is and is not.
          releaseDraft: false
          prerelease: false

  android:
    name: Android APK (arm64)
    needs: [check-and-bump, desktop]
    if: needs.check-and-bump.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK and NDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK found" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paperwren-android-debug-keystore

      - name: Generate app icons
        run: |
          npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons
          npx tauri icon assets/brand/app-icon-foreground.svg --output .tauri-icons-android

      - name: Initialize Android project
        run: npx tauri android init

      - name: Patch generated Android project
        run: |
          node scripts/patch-android-signing.mjs
          node scripts/patch-android-icons.mjs

      - name: Build release APK (arm64)
        run: npm run tauri -- android build --target aarch64

      - name: Collect APK
        run: |
          set -eo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          APK=$(find "$APK_DIR" -name "app-universal-release.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            echo "No release APK found under $APK_DIR"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          VERSION="${{ needs.check-and-bump.outputs.version }}"
          cp "$APK" "Paperwren-v$VERSION-android-arm64-testkey.apk"
          ls -la "Paperwren-v$VERSION-android-arm64-testkey.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-and-bump.outputs.version }}
          files: Paperwren-v*-android-arm64-testkey.apk
          fail_on_unmatched_files: true
