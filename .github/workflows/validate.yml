name: Test builds

# Non-release validation for working branches and PRs (audit
# section 17.4): frontend lint/type/test, Rust checks, browser
# integration tests, Windows installers, an Android APK and a macOS disk image
# uploaded as artifacts. Never bumps versions, tags, or publishes
# releases.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Validate Android sources
        run: node scripts/install-android.mjs check

      - name: Android icon foreground bounding-box check
        run: node scripts/check-icon-foreground.mjs

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust
        working-directory: src-tauri
        run: cargo test --all-targets

  browser:
    name: Browser integration tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright without touching the lockfile
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build the app
        run: npm run build

      - name: Run browser tests
        run: npx playwright test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  windows:
    name: Windows installers (test build)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons

      - name: Build Windows installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Paperwren-windows-test
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # A disk image to try on a Mac before anything is published.
  macos:
    name: macOS disk image (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons

      - name: Build universal app and disk image
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify bundle (both architectures, ad hoc signature)
        run: node scripts/verify-macos-bundle.mjs src-tauri/target/universal-apple-darwin/release/bundle

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperwren-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Paperwren_*_universal.dmg
          if-no-files-found: error

  android:
    name: Android APK (optimized test build, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK and NDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK found" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-validate
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: paperwren-android-debug-keystore

      - name: Generate app icons
        run: |
          npx tauri icon assets/brand/app-icon.svg --output src-tauri/icons
          npx tauri icon assets/brand/app-icon-foreground.svg --output .tauri-icons-android

      - name: Initialize Android project
        run: npx tauri android init

      - name: Patch generated Android project
        run: |
          node scripts/patch-android-signing.mjs
          node scripts/patch-android-icons.mjs
          node scripts/install-android.mjs

      # Release-mode optimization does not publish a release. The signing
      # patch falls back to the cached debug key; no publishing secrets are used.
      - name: Build optimized test APK (arm64)
        run: npx tauri android build --apk --target aarch64

      # src-tauri/.cargo/config.toml adds it to wry's WebView client; without
      # it a dead renderer closes the app without a word.
      - name: Check the WebView client answers a dead renderer
        shell: bash
        run: |
          grep -rqs "override fun onRenderProcessGone" src-tauri/gen/android || {
            echo "::error::RustWebViewClient has no onRenderProcessGone (see src-tauri/.cargo/config.toml)"
            exit 1
          }

      - name: Collect APK
        run: |
          set -eo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release.apk" | head -1 || true)
          if [ -z "$APK" ]; then
            echo "No optimized APK found"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/Paperwren-test-android-arm64.apk

      - name: Verify APK signature, architecture and size
        run: |
          set -eo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose artifacts/Paperwren-test-android-arm64.apk
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          apk = Path("artifacts/Paperwren-test-android-arm64.apk")
          size = apk.stat().st_size / 1024 / 1024
          with zipfile.ZipFile(apk) as archive:
              libraries = [entry for entry in archive.infolist()
                           if entry.filename.startswith("lib/") and entry.filename.endswith(".so")]
          abis = {entry.filename.split("/")[1] for entry in libraries}
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"Expected only ARM64 libraries, found {sorted(abis)}")
          for entry in libraries:
              print(f"{entry.filename}: {entry.file_size / 1024 / 1024:.1f} MiB")
          print(f"Optimized test APK: {size:.1f} MiB")
          if size > 60:
              raise SystemExit("APK exceeds 60 MiB; check for debug code or bundled test assets")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Android test APK\n\n{size:.1f} MiB · ARM64 · optimized · test-key signed\n")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperwren-test-android-arm64
          path: artifacts/Paperwren-test-android-arm64.apk
          if-no-files-found: error
