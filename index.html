<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Paperwren</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Sepia pages (global.css, "Page colour"): each channel scaled, so
         white paper turns warm and black ink stays black; the second
         scales a picture on that paper back. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <filter id="pw-sepia" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.957 0 0 0 0  0 0.91 0 0 0  0 0 0.8 0 0  0 0 0 1 0"
        />
      </filter>
      <filter id="pw-sepia-undo" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="1.045 0 0 0 0  0 1.099 0 0 0  0 0 1.25 0 0  0 0 0 1 0"
        />
      </filter>
    </svg>
    <script>
      // Paperwren open-with bridge (Android). MainActivity evaluates
      // window.__paperwrenOpenFile once the webview exists; payloads
      // collect here until React mounts and drains them. Defined
      // inline so it exists the moment the page loads, before any
      // bundle code. Returns true: the Kotlin side retries when the
      // answer is anything else, so a delivery is never lost into a
      // page that had not finished loading.
      window.__paperwrenFiles = [];
      // `caller`: another app opened it with Paperwren ("started" or
      // "woken" Paperwren); Back on it goes back to that app.
      window.__paperwrenOpenFile = function (path, name, size, caller) {
        window.__paperwrenFiles.push({
          path: path,
          name: name,
          size: size || 0,
          caller: caller || null,
        });
        window.dispatchEvent(new CustomEvent("paperwren-file"));
        return true;
      };

      // A WebView too old for the app (before Chrome 89: phones whose
      // WebView is never updated) would show a blank screen. Plain
      // words instead, written so that engine can run them.
      (function () {
        var m = /\bChrom(?:e|ium)\/(\d+)/.exec(navigator.userAgent);
        if (!m || Number(m[1]) >= 89) return;
        window.__paperwrenTooOld = true;
        document.addEventListener("DOMContentLoaded", function () {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div style="max-width:420px;margin:0 auto;padding:48px 24px;font:16px/1.5 sans-serif;color:#23221f">' +
            '<h1 style="font-size:20px;margin:0 0 12px">Paperwren needs a newer WebView</h1>' +
            "<p>This phone's web engine (Android System WebView, version " + m[1] +
            ") is too old to run Paperwren. Update it from your app store, or on a Huawei phone update Huawei WebView in AppGallery, then open Paperwren again.</p>" +
            '<p lang="zh">此手机的网页引擎（WebView 版本 ' + m[1] +
            "）过旧，无法运行 Paperwren。请在应用商店更新 Android System WebView（华为手机请在应用市场更新华为 WebView），然后重新打开 Paperwren。</p>" +
            "</div>";
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
